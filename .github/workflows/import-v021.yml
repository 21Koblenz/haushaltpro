    6cf9663d33b8547b9cb4ca69557616a260aa388f b9584e546cbd5984e98fd28de9cd0cc55e813446 52081fbaefe0098873c86846202fcd0f218c27c9 9fdde7a0e5764fc6c2878638a9950ef7b806724b 76cea021635adc6c0d8eeedd204d202840dc2aae 7bf94881bb18c789a06086dfd36206ec563c8083 4e98381bc4d65edb34df41ca29dcfb5b3583f57c e0abac773217cbb41d4a9c85b6adaa26e712cc0f 28ba515c19085c0639e736ceb4d3ef459240a9f8 ef6a904ed990103eed4c0ea599e140a40ad3d1f2
    26dc6575555e386b8e8365ff09a0058b19566c53 f723b9cccb6848ac3aa44538e17152e31aa726d6 7d0721e255eb0a1c264dfeef5b5c3f5ab080bb97 1fa72faf4795808e62269dff30fed9fcb674a04a 2e8b3cf89c925267ae18ac62672ea23edfe86b8b a5561f578ee4cd627b9e932612badb9d572b23da 994ee69b702bedbc13664b615b44bf056c3b6d23 15b9e1d3c015b38674d665f13f5da1e3280b7325 d362db8392be2143d987381accefbd22e04198e0 50b2d4fefb638a439e56ed426e29bd7595006cfc 31dc6cb54abf4f65cb51cae43a0abd89474b5905 19eb4271cc2e4baaae41c727321b02c23ac3169e

jobs:
  import-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and verify exact release
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'}
          repo=os.environ['GITHUB_REPOSITORY']
          with open('/tmp/release.b64','wb') as out:
              for sha in os.environ['CHUNKS'].split():
                  req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers=headers)
                  with urllib.request.urlopen(req) as r: payload=json.load(r)
                  out.write(base64.b64decode(payload['content']))
          PY
          echo "Base64 chars: $(wc -c < /tmp/release.b64)"
          test "$(wc -c < /tmp/release.b64)" -eq 233800
          base64 -d /tmp/release.b64 > /tmp/haushaltpro-v0.21.0-original.tar.gz
          echo "$EXPECTED_ARCHIVE_SHA256  /tmp/haushaltpro-v0.21.0-original.tar.gz" | sha256sum -c -
          mkdir -p /tmp/release /tmp/release-git
          tar -xzf /tmp/haushaltpro-v0.21.0-original.tar.gz -C /tmp/release --strip-components=1
          git --git-dir=/tmp/release-git init -q
          git --git-dir=/tmp/release-git --work-tree=/tmp/release add -A
          ACTUAL_TREE="$(git --git-dir=/tmp/release-git --work-tree=/tmp/release write-tree)"
          echo "Release tree: $ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
      - name: Install production and test dependencies
        run: python -m pip install -r /tmp/release/requirements.txt httpx2==2.12.0
      - name: Compile, run 51 tests and security audit
        shell: bash
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          cd /tmp/release
          python -m compileall -q app tests
          count=0
          for t in tests/test_*.py; do
            echo "== $t =="
            python "$t"
            count=$((count + 1))
          done
          echo "Tests executed: $count"
          test "$count" -eq 51
          python tests/security_audit.py
      - name: Build Docker image
        run: docker build --pull -t haushaltpro:0.21.0 /tmp/release
      - name: Publish exact tested application source
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/. .
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          echo "Staged tested tree: $ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: publish tested HaushaltPro v0.21.0 source'
          git push origin HEAD:main
      - name: Fix permanent CI test environment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          s=s.replace('run: python -m pip install -r requirements.txt','run: python -m pip install -r requirements.txt httpx2==2.12.0')
          s=s.replace('          set -e\n          for t in tests/test_*.py; do','          set -e\n          sudo install -d -o "$(id -u)" -g "$(id -g)" /app\n          for t in tests/test_*.py; do')
          p.write_text(s)
          PY
          git add .github/workflows/ci.yml
          git commit -m 'ci: align GitHub runner with application tests'
          git push origin HEAD:main
      - name: Tag and create GitHub release
        shell: bash
        run: |
          git tag -a v0.21.0 -m 'HaushaltPro v0.21.0'
          git push origin v0.21.0
          git archive --format=tar.gz --prefix=haushaltpro-v0.21.0/ HEAD > /tmp/haushaltpro-v0.21.0.tar.gz
          sha256sum /tmp/haushaltpro-v0.21.0.tar.gz > /tmp/haushaltpro-v0.21.0.tar.gz.sha256
          cat > /tmp/release-notes.md <<'EOF'
          # HaushaltPro v0.21.0

          First public open-source release of HaushaltPro.

          - exact imported application payload verified by SHA-256 and Git tree hash
          - 51/51 application regression and plausibility tests passed on GitHub
          - 45/45 internal security-audit checks passed
          - Python compile check passed
          - Docker image build passed
          - demo household: EUR 7,200 opening wealth, EUR 3,050 income, EUR 1,770 expenses, EUR 8,480 closing wealth
          - local/LAN, VPN and public HTTPS deployment documentation
          - multi-user/multi-household support, CSV import, transfers, planning, forecasts, budgets and audit functions
          - mobile-responsive transaction view
          - Vibe Coding / AI-assisted development disclosure
          - GNU AGPL-3.0-or-later
          EOF
          gh release create v0.21.0 /tmp/haushaltpro-v0.21.0.tar.gz#haushaltpro-v0.21.0.tar.gz /tmp/haushaltpro-v0.21.0.tar.gz.sha256#haushaltpro-v0.21.0.tar.gz.sha256 --title 'HaushaltPro v0.21.0' --notes-file /tmp/release-notes.md
