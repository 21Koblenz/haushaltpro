name: Import tested v0.21.0

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  EXPECTED_ARCHIVE_SHA256: 6e250bf57f6fd226ecc4a7b495624495fa513223e9b51560349d820da63a28c1
  EXPECTED_TREE: 95cb10018b46abe39f795fdd2e93889759a005e6
