name: Fix v0.21.1 test version whitelists

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.21.1-prep
      - name: Extend legacy version whitelists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed=[]
          for p in sorted(Path('tests').glob('test_*.py')):
              s=p.read_text(encoding='utf-8')
              if 'APP_VERSION' not in s or "'0.21.0'" not in s or "'0.21.1'" in s:
                  continue
              old=s
              s=s.replace("'0.21.0'}", "'0.21.0','0.21.1'}")
              s=s.replace('"0.21.0"}', '"0.21.0","0.21.1"}')
              if s != old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('updated:', *changed, sep='\n- ')
          PY
      - name: Commit and push
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No whitelist changes needed"
            exit 0
          fi
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git add tests
          git commit -m "test: allow v0.21.1 in legacy version checks"
          git push origin HEAD:release/v0.21.1-prep
