# Final rerun after cache-bust, i18n and recurring-entrypoint fixes.
name: Apply offline sync feature

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-offline-sync.yml

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Apply offline sync patch
        run: |
          python scripts/apply_offline_sync.py
          python - <<'PY'
          from pathlib import Path
          p=Path('static/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span id="connectionText">Server prüfen …</span>','<span id="connectionText"></span>',1)
          s=s.replace('0.21.9-offline1','0.21.8-offline1')
          old='<div class="section-head recurring-section-head"><div><h2>Wiederkehrende Buchungen</h2><p class="muted">Aktive Serien. Neue Serien werden hier direkt angelegt; einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.</p></div><button class="ghost" id="newRecurringTx">+ Wiederkehrende Buchung</button></div>'
          new='<div class="section-head recurring-section-head"><div><h2>Wiederkehrende Buchungen</h2><p class="muted">Aktive Serien. Neue Serien legst du über „+ Buchung“ an; einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.</p></div></div>'
          if old not in s: raise SystemExit('recurring entrypoint HTML anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          a=Path('static/app.js')
          js=a.read_text(encoding='utf-8')
          oldjs="$('quickTx').onclick=()=>txDialog();$('newTx').onclick=()=>txDialog();$('newTransfer').onclick=()=>transferDialog();$('newRecurringTx').onclick=()=>recDialog(null);"
          newjs="$('quickTx').onclick=()=>txDialog();$('newTx').onclick=()=>txDialog();$('newTransfer').onclick=()=>transferDialog();"
          if oldjs not in js: raise SystemExit('recurring entrypoint JS anchor not found')
          a.write_text(js.replace(oldjs,newjs,1),encoding='utf-8')
          t=Path('tests/test_offline_sync.py')
          ts=t.read_text(encoding='utf-8').replace('0.21.9-offline1','0.21.8-offline1')
          t.write_text(ts,encoding='utf-8')
          PY
      - name: Validate syntax and full regression suite
        run: |
          set -e
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          python -m compileall -q app tests
          node --check static/app.js
          node --check static/offline-sync.js
          node --check static/ui-enhancements.js
          for test_file in tests/test_*.py; do
            echo "==> $test_file"
            python "$test_file"
          done
          python scripts/performance_probe.py
          git diff --check
      - name: Commit tested feature
        run: |
          set -e
          git rm scripts/apply_offline_sync.py .github/workflows/apply-offline-sync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add offline queue and server sync status"
          git push origin HEAD:main
