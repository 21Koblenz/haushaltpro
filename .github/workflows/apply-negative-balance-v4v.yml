name: Apply negative balance and V4V patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch UI, changelog and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('static/index.html')
          text = index.read_text(encoding='utf-8')
          css_link = '  <link rel="stylesheet" href="/assets/ui-enhancements.css">\n'
          if css_link not in text:
              text = text.replace('  <link rel="stylesheet" href="/assets/style.css">\n', '  <link rel="stylesheet" href="/assets/style.css">\n' + css_link, 1)

          old_footer = '    <footer class="app-footer"><span>HaushaltPro</span><span id="appVersion">Version –</span><span><a href="https://github.com/21Koblenz/haushaltpro" target="_blank" rel="noopener noreferrer">Quellcode · AGPL-3.0+</a></span></footer>'
          new_footer = '''    <footer class="app-footer">
                <div class="app-footer-meta">
                  <span>HaushaltPro</span><span id="appVersion">Version –</span><span><a href="https://github.com/21Koblenz/haushaltpro" target="_blank" rel="noopener noreferrer">Quellcode · AGPL-3.0+</a></span>
                </div>
                <div class="app-footer-v4v">
                  <div class="app-footer-v4v-copy">
                    <strong>Value for Value</strong>
                    <span>Wenn HaushaltPro dir einen Wert liefert, kannst du Sats zurückgeben.</span>
                    <a class="lightning-address" href="lightning:creamowl25@primal.net">⚡ creamowl25@primal.net</a>
                  </div>
                  <a class="footer-qr-link" href="lightning:creamowl25@primal.net" aria-label="Lightning QR-Code öffnen">
                    <img class="footer-lightning-qr" src="/assets/lightning-qr-black.svg" alt="Lightning QR-Code für Value for Value">
                  </a>
                </div>
              </footer>'''
          if old_footer in text:
              text = text.replace(old_footer, new_footer, 1)
          elif 'lightning:creamowl25@primal.net' not in text:
              raise SystemExit('Expected footer marker not found')

          script = '  <script src="/assets/ui-enhancements.js"></script>\n'
          if script not in text:
              text = text.replace('  <script src="/assets/app.js"></script>\n', '  <script src="/assets/app.js"></script>\n' + script, 1)
          index.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          change = changelog.read_text(encoding='utf-8')
          fixed = '- New and corrected account balances can now be entered reliably as negative values on mobile devices; signed balance fields support decimal comma/point input and an explicit `±` control.\n'
          if fixed not in change:
              anchor = '- CI now builds the Docker image for both architectures and verifies that SQLCipher 4 starts successfully inside each image.\n'
              change = change.replace(anchor, anchor + fixed, 1)
          added = '\n### Added\n\n- Value-for-Value footer with the Lightning address `creamowl25@primal.net`.\n- Theme-aware local Lightning QR code for dark and light mode.\n'
          if 'Value-for-Value footer with the Lightning address' not in change:
              change = change.replace('\n## v0.21.0 - 2026-09-12', added + '\n## v0.21.0 - 2026-09-12', 1)
          changelog.write_text(change, encoding='utf-8')

          test = Path('tests/test_negative_opening_v4v.py')
          test.write_text(r'''import sqlite3
          import sys
          import tempfile
          import types
          from pathlib import Path

          shim = types.ModuleType("sqlcipher3")
          shim.dbapi2 = sqlite3
          sys.modules["sqlcipher3"] = shim
          root = Path(__file__).resolve().parents[1]
          Path("/app").mkdir(exist_ok=True)
          static_mount = Path("/app/static")
          if static_mount.is_symlink() and static_mount.resolve() != (root / "static").resolve():
              static_mount.unlink()
          if not static_mount.exists():
              static_mount.symlink_to(root / "static", target_is_directory=True)
          sys.path.insert(0, str(root))

          from app import db
          fd, tmp = tempfile.mkstemp(suffix=".db")
          Path(tmp).unlink(missing_ok=True)
          c = sqlite3.connect(tmp, check_same_thread=False)
          c.row_factory = sqlite3.Row
          c.execute("PRAGMA foreign_keys=ON")
          db._conn = c
          db.DB_PATH = Path(tmp)
          db.init_schema(c)

          from app import main
          main.db._conn = c
          main.session = lambda request, write=False: ("test", 1, "csrf", 0)
          from fastapi.testclient import TestClient
          client = TestClient(main.app)

          payload = {
              "name": "Dispo Test",
              "type": "checking",
              "opening_balance": "-1234.56",
              "currency": "EUR",
              "start_date": "2026-09-01",
          }
          r = client.post("/api/accounts", json=payload)
          assert r.status_code == 200, (r.status_code, r.text)
          account_id = r.json()["id"]
          row = c.execute("SELECT opening_balance FROM accounts WHERE id=?", (account_id,)).fetchone()
          assert row["opening_balance"] == -123456, row["opening_balance"]
          accounts = client.get("/api/accounts?month=2026-09").json()
          account = next(x for x in accounts if x["id"] == account_id)
          assert account["opening_balance"] == -1234.56, account
          assert account["month_start_balance"] == -1234.56, account
          assert account["balance"] == -1234.56, account
          assert account["month_end_balance"] == -1234.56, account

          enhancements = (root / "static/ui-enhancements.js").read_text(encoding="utf-8")
          assert "function normalizeSignedMoneyInput" in enhancements
          assert "new Set(['opening_balance', 'actual_balance'])" in enhancements
          assert "input.type = 'text'" in enhancements
          assert "input.inputMode = 'decimal'" in enhancements
          assert "toggle.textContent = '±'" in enhancements
          assert "value = value.replace(',', '.')" in enhancements
          assert "Guthaben positiv, Soll/Dispo negativ" in enhancements

          index = (root / "static/index.html").read_text(encoding="utf-8")
          style = (root / "static/ui-enhancements.css").read_text(encoding="utf-8")
          assert "/assets/ui-enhancements.js" in index and "/assets/ui-enhancements.css" in index
          assert index.count("lightning:creamowl25@primal.net") >= 2
          assert "/assets/lightning-qr-black.svg" in index
          assert "filter:invert(1)" in style
          assert 'html[data-theme="light"] .footer-lightning-qr{filter:none}' in style
          qr = root / "static/lightning-qr-black.svg"
          assert qr.exists() and qr.stat().st_size > 1000
          qr_content = qr.read_text(encoding="utf-8")
          assert "<svg" in qr_content and "#000000" in qr_content

          print("negative account opening balance + mobile signed input + V4V footer: PASS")
          c.close()
          Path(tmp).unlink(missing_ok=True)
          ''', encoding='utf-8')
          PY

          python -m compileall -q tests/test_negative_opening_v4v.py
          node --check static/ui-enhancements.js

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git add static/index.html CHANGELOG.md tests/test_negative_opening_v4v.py
          git commit -m "fix: negative account balances and V4V footer"
          git push origin main
