name: Apply recurring payee support

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recurring-payee.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add recurring payee support
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old,new,1)

          # Database: recurring series get their own payee field.
          p=Path('app/db.py'); s=p.read_text(encoding='utf-8')
          s=replace_once(s,
              '            name TEXT NOT NULL,\n            amount INTEGER NOT NULL,\n            next_date TEXT NOT NULL,\n            frequency TEXT NOT NULL CHECK(frequency IN (\'daily\',\'weekly\',\'monthly\',\'yearly\')),\n            interval_count INTEGER NOT NULL DEFAULT 1 CHECK(interval_count >= 1),',
              '            name TEXT NOT NULL,\n            payee TEXT,\n            amount INTEGER NOT NULL,\n            next_date TEXT NOT NULL,\n            frequency TEXT NOT NULL CHECK(frequency IN (\'daily\',\'weekly\',\'monthly\',\'yearly\')),\n            interval_count INTEGER NOT NULL DEFAULT 1 CHECK(interval_count >= 1),',
              'recurring schema payee')
          s=replace_once(s,
              '    if "interval_count" not in rcols:\n        c.execute("ALTER TABLE recurring ADD COLUMN interval_count INTEGER NOT NULL DEFAULT 1")\n    c.execute("UPDATE recurring SET interval_count=1 WHERE interval_count IS NULL OR interval_count<1")',
              '    if "interval_count" not in rcols:\n        c.execute("ALTER TABLE recurring ADD COLUMN interval_count INTEGER NOT NULL DEFAULT 1")\n    if "payee" not in rcols:\n        c.execute("ALTER TABLE recurring ADD COLUMN payee TEXT")\n    c.execute("UPDATE recurring SET interval_count=1 WHERE interval_count IS NULL OR interval_count<1")\n    c.execute("""UPDATE recurring SET payee=(\n        SELECT t.payee FROM transactions t\n        JOIN recurring rr ON rr.id=t.recurring_id\n        WHERE COALESCE(rr.series_id,rr.id)=COALESCE(recurring.series_id,recurring.id)\n          AND t.payee IS NOT NULL AND TRIM(t.payee)<>\'\'\n        ORDER BY t.booking_date,t.id LIMIT 1\n    ) WHERE payee IS NULL OR TRIM(payee)=\'\'""")',
              'recurring migration payee')
          s=s.replace("INSERT OR REPLACE INTO app_meta(key,value) VALUES('schema_version','23');","INSERT OR REPLACE INTO app_meta(key,value) VALUES('schema_version','24');")
          s=s.replace("c.execute(\"INSERT INTO app_meta(key,value) VALUES('schema_version','23') ON CONFLICT(key) DO UPDATE SET value='23'\")","c.execute(\"INSERT INTO app_meta(key,value) VALUES('schema_version','24') ON CONFLICT(key) DO UPDATE SET value='24'\")")
          if "schema_version','23" in s:
              raise SystemExit('old schema version 23 still present')
          p.write_text(s,encoding='utf-8')

          # Backend: accept, persist and propagate the payee.
          p=Path('app/main.py'); s=p.read_text(encoding='utf-8')
          s=replace_once(s,
              'class RecurringIn(BaseModel):\n    account_id: int\n    category_id: int | None = None\n    name: str = Field(min_length=1, max_length=150)\n    amount: Decimal',
              'class RecurringIn(BaseModel):\n    account_id: int\n    category_id: int | None = None\n    name: str = Field(min_length=1, max_length=150)\n    payee: str | None = Field(default=None, max_length=200)\n    amount: Decimal',
              'RecurringIn payee')

          s=replace_once(s,
              '            recurring_id = rcur.lastrowid\n            c.execute("UPDATE recurring SET interval_count=? WHERE id=?", (x.recurring_interval_count, recurring_id))',
              '            recurring_id = rcur.lastrowid\n            c.execute("UPDATE recurring SET interval_count=?,payee=? WHERE id=?", (x.recurring_interval_count, clean_text(x.payee,200), recurring_id))',
              'transaction recurring create payee')
          s=replace_once(s,
              '            if active_recurring_id:\n                c.execute("UPDATE recurring SET interval_count=? WHERE id=?", (x.recurring_interval_count, active_recurring_id))',
              '            if active_recurring_id:\n                c.execute("UPDATE recurring SET interval_count=?,payee=? WHERE id=?", (x.recurring_interval_count, clean_text(x.payee,200), active_recurring_id))',
              'transaction recurring update payee')

          s=replace_once(s,
              '            (r["account_id"],amount,"income" if amount>=0 else "expense",due.isoformat(),r["name"],r["name"],\n             ev.get("override_note"),r["category_id"],transaction_status,external_id,recurring_id,r["confidence"] or "fixed",int(r["fixed_cost"] or 0),ts,ts),',
              '            (r["account_id"],amount,"income" if amount>=0 else "expense",due.isoformat(),r["name"],r["payee"] or r["name"],\n             ev.get("override_note"),r["category_id"],transaction_status,external_id,recurring_id,r["confidence"] or "fixed",int(r["fixed_cost"] or 0),ts,ts),',
              'planned recurring transaction payee')
          s=replace_once(s,
              '            (r["account_id"], booked_amount, "income" if r["kind"]=="income" else "expense", due.isoformat(), r["name"], r["name"], "Aus wiederkehrender Buchung", r["category_id"],',
              '            (r["account_id"], booked_amount, "income" if r["kind"]=="income" else "expense", due.isoformat(), r["name"], r["payee"] or r["name"], "Aus wiederkehrender Buchung", r["category_id"],',
              'executed recurring transaction payee')

          s=replace_once(s,
              '        c.execute("UPDATE recurring SET interval_count=? WHERE id=?",(x.interval_count,cur.lastrowid))\n        created=recurring_snapshot(c,cur.lastrowid)',
              '        c.execute("UPDATE recurring SET interval_count=?,payee=? WHERE id=?",(x.interval_count,clean_text(x.payee,200),cur.lastrowid))\n        created=recurring_snapshot(c,cur.lastrowid)',
              'dedicated recurring create payee')
          s=replace_once(s,
              '            c.execute("UPDATE recurring SET account_id=?,category_id=?,name=?,amount=?,next_date=?,frequency=?,interval_count=?,kind=?,max_amount=?,anchor_date=?,valid_from=?,valid_until=?,confidence=?,fixed_cost=? WHERE id=?",\n                (x.account_id,x.category_id,x.name.strip(),amount,x.next_date.isoformat(),x.frequency,x.interval_count,kind,max_amount,x.next_date.isoformat(),effective.isoformat(),x.valid_until.isoformat() if x.valid_until else None,x.confidence,int(x.fixed_cost),recurring_id))\n            series_id=int(old["series_id"] or old["id"])',
              '            c.execute("UPDATE recurring SET account_id=?,category_id=?,name=?,amount=?,next_date=?,frequency=?,interval_count=?,kind=?,max_amount=?,anchor_date=?,valid_from=?,valid_until=?,confidence=?,fixed_cost=? WHERE id=?",\n                (x.account_id,x.category_id,x.name.strip(),amount,x.next_date.isoformat(),x.frequency,x.interval_count,kind,max_amount,x.next_date.isoformat(),effective.isoformat(),x.valid_until.isoformat() if x.valid_until else None,x.confidence,int(x.fixed_cost),recurring_id))\n            c.execute("UPDATE recurring SET payee=? WHERE id=?",(clean_text(x.payee,200),recurring_id))\n            series_id=int(old["series_id"] or old["id"])',
              'dedicated recurring direct update payee')
          s=replace_once(s,
              '        c.execute("UPDATE recurring SET interval_count=? WHERE id=?",(x.interval_count,cur.lastrowid))\n        _remove_planned_series_transactions(c,series_id,effective)',
              '        c.execute("UPDATE recurring SET interval_count=?,payee=? WHERE id=?",(x.interval_count,clean_text(x.payee,200),cur.lastrowid))\n        _remove_planned_series_transactions(c,series_id,effective)',
              'dedicated recurring version payee')

          s=s.replace('(\"name\",\"amount\",\"next_date\",\"frequency\",\"interval_count\",\"account_name\"','(\"name\",\"payee\",\"amount\",\"next_date\",\"frequency\",\"interval_count\",\"account_name\"')
          p.write_text(s,encoding='utf-8')

          # UI: restore the direct add button and give that dialog the same payee picker.
          p=Path('static/index.html'); s=p.read_text(encoding='utf-8')
          s=replace_once(s,
              '<div class="section-head recurring-section-head"><div><h2>Wiederkehrende Buchungen</h2><p class="muted">Aktive Serien. Neue Serien legst du über „+ Buchung“ an und aktivierst dort „Wiederkehrende Zahlung / Einnahme“. Einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.</p></div></div>',
              '<div class="section-head recurring-section-head"><div><h2>Wiederkehrende Buchungen</h2><p class="muted">Aktive Serien. Neue Serien werden hier direkt angelegt; einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.</p></div><button class="ghost" id="newRecurringTx">+ Wiederkehrende Buchung</button></div>',
              'restore recurring add button')
          s=s.replace('v=0.21.8-intervals1','v=0.21.8-recurring-payee1')
          p.write_text(s,encoding='utf-8')

          p=Path('static/app.js'); s=p.read_text(encoding='utf-8')
          s=replace_once(s,
              "$('quickTx').onclick=()=>txDialog();$('newTx').onclick=()=>txDialog();$('newTransfer').onclick=()=>transferDialog();",
              "$('quickTx').onclick=()=>txDialog();$('newTx').onclick=()=>txDialog();$('newTransfer').onclick=()=>transferDialog();$('newRecurringTx').onclick=()=>recDialog(null);",
              'recurring add handler')
          s=replace_once(s,
              '<label>Konto<select name="account_id">${accountOptions(rec?.account_id)}</select></label><label>Name<input name="name" required value="${esc(rec?.name||\'\')}"></label><label>Kategorie<select name="category_id">${categoryOptions(rec?.category_id)}</select></label>',
              '<label>Konto<select name="account_id">${accountOptions(rec?.account_id)}</select></label><label>Name<input name="name" required value="${esc(rec?.name||\'\')}"></label><label>Empfänger<input name="payee" list="payeeSuggestions" autocomplete="off" placeholder="z. B. Vermieter, Versicherung, Stadtwerke" value="${esc(rec?.payee||\'\')}"><datalist id="payeeSuggestions">${payeePresetsCache.map(p=>`<option value="${esc(p.name)}"></option>`).join(\'\')}</datalist></label><label>Kategorie<select name="category_id">${categoryOptions(rec?.category_id)}</select></label>',
              'recurring dialog payee input')
          s=replace_once(s,
              "const body={account_id:Number(f.get('account_id')),category_id:f.get('category_id')?Number(f.get('category_id')):null,name:f.get('name'),amount:String(f.get('amount'))",
              "const body={account_id:Number(f.get('account_id')),category_id:f.get('category_id')?Number(f.get('category_id')):null,name:f.get('name'),payee:f.get('payee')||null,amount:String(f.get('amount'))",
              'recurring dialog payee payload')
          s=s.replace('<h2>Wiederholungsserie bearbeiten</h2>','<h2>${rec?\'Wiederholungsserie bearbeiten\':\'Wiederkehrende Buchung anlegen\'}</h2>',1)
          p.write_text(s,encoding='utf-8')

          # Regression: dedicated recurring dialog/button and backend propagation stay covered.
          test=Path('tests/test_recurring_payee.py')
          test.write_text('''import sqlite3, sys, types, tempfile\nfrom datetime import date, timedelta\nfrom pathlib import Path\n\nshim=types.ModuleType("sqlcipher3"); shim.dbapi2=sqlite3; sys.modules["sqlcipher3"]=shim\nroot=Path(__file__).resolve().parents[1]\nPath("/app").mkdir(exist_ok=True)\nstatic=Path("/app/static")\nif not static.exists(): static.symlink_to(root/"static", target_is_directory=True)\nsys.path.insert(0,str(root))\nfrom app import db\nfd,tmp=tempfile.mkstemp(suffix=".db"); Path(tmp).unlink(missing_ok=True)\nc=sqlite3.connect(tmp,check_same_thread=False); c.row_factory=sqlite3.Row; c.execute("PRAGMA foreign_keys=ON")\ndb._conn=c; db.DB_PATH=Path(tmp); db.init_schema(c)\nfrom app import main\nmain.db._conn=c\nmain.session=lambda request,write=False:("test",1,"csrf",0)\nfrom fastapi.testclient import TestClient\nclient=TestClient(main.app)\n\ndef ok(r):\n    assert r.status_code < 300,(r.status_code,r.text)\n    return r.json()\n\nacc=ok(client.post("/api/accounts",json={"name":"Testkonto","type":"checking","opening_balance":1000,"currency":"EUR","start_date":date.today().isoformat()}))\ncat=ok(client.post("/api/categories",json={"name":"Vertrag","direction":"expense"}))\ndue=date.today()+timedelta(days=1)\npayload={"account_id":acc["id"],"category_id":cat["id"],"name":"Stromabschlag","payee":"Stadtwerke Test","amount":"42.00","next_date":due.isoformat(),"frequency":"monthly","interval_count":1,"kind":"direct_debit","active":True,"valid_until":due.isoformat(),"confidence":"fixed","fixed_cost":True}\ncreated=ok(client.post("/api/recurring",json=payload))\nr=c.execute("SELECT payee FROM recurring WHERE id=?",(created["id"],)).fetchone(); assert r["payee"]=="Stadtwerke Test",r\ntx=c.execute("SELECT payee,status FROM transactions WHERE recurring_id=? AND booking_date=?",(created["id"],due.isoformat())).fetchone(); assert tx and tx["payee"]=="Stadtwerke Test" and tx["status"]=="planned",tx\nrows=ok(client.get("/api/recurring")); row=next(x for x in rows if x["id"]==created["id"]); assert row["payee"]=="Stadtwerke Test",row\npayload["payee"]="Neuer Stadtwerke Name"; payload["effective_from"]=due.isoformat()\nok(client.put(f"/api/recurring/{created['id']}",json=payload))\nr=c.execute("SELECT payee FROM recurring WHERE id=?",(created["id"],)).fetchone(); assert r["payee"]=="Neuer Stadtwerke Name",r\ntx=c.execute("SELECT payee FROM transactions WHERE recurring_id=? AND booking_date=? AND status=\'planned\'",(created["id"],due.isoformat())).fetchone(); assert tx and tx["payee"]=="Neuer Stadtwerke Name",tx\nindex=(root/"static/index.html").read_text(encoding="utf-8"); appjs=(root/"static/app.js").read_text(encoding="utf-8")\nassert 'id="newRecurringTx"' in index and '+ Wiederkehrende Buchung' in index\nassert "$('newRecurringTx').onclick=()=>recDialog(null)" in appjs\nassert 'name="payee" list="payeeSuggestions"' in appjs\nprint("recurring payee + dedicated add button: PASS")\n''',encoding='utf-8')

          Path('CHANGELOG.md').write_text(Path('CHANGELOG.md').read_text(encoding='utf-8').replace('## Unreleased\n','## Unreleased\n\n### Changed\n\n- The dedicated “+ Wiederkehrende Buchung” entry point remains available and now supports saved/free-text payees. The payee is stored on the recurring series and propagated to generated planned transactions.\n',1),encoding='utf-8')
          PY

          python -m compileall -q app tests
          git diff --check
          git add app/db.py app/main.py static/index.html static/app.js tests/test_recurring_payee.py CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add payees to recurring series"
          git push origin HEAD:main
