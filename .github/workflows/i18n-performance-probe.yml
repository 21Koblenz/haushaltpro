# 10k-row baseline trigger, idempotent
name: Plausibility and performance probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/i18n-performance-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Ensure validated fixtures and English translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          test=Path('tests/test_v0219_plausibility_matrix.py')
          s=test.read_text(encoding='utf-8')
          replacements={
            "assert src_m['month_end_balance']==2650.0,src_m  # 2000 - 50 - 100 + 1000 - 200":
            "assert src_m['month_end_balance']==2570.0,src_m  # 1920 Sep opening after Aug -80; then -50 -100 +1000 -200",
            "assert zero.status_code==400,zero.text":
            "assert zero.status_code in (400,422),zero.text",
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'plausibility fixture is neither old nor expected: {old}')
          test.write_text(s,encoding='utf-8')
          p=Path('static/i18n/en.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          legacy=data.setdefault('legacy',{})
          legacy['z. B. Vermieter, Versicherung, Stadtwerke']='e.g. landlord, insurer, utility company'
          legacy['Aktive Serien. Neue Serien werden hier direkt angelegt; einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.']='Active series. Create new series directly here; individual executed occurrences also appear under “All transactions”. Changes can take effect from any chosen date.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Plausibility matrix
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          python tests/test_v0219_plausibility_matrix.py
          python tests/test_i18n_preview.py
      - name: Performance probe
        run: python scripts/performance_probe.py
      - name: Commit tested repairs if needed
        run: |
          git diff --check
          git add static/i18n/en.json tests/test_v0219_plausibility_matrix.py
          if git diff --cached --quiet; then
            echo "No repair commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete recurring transfer validation"
          git push origin HEAD:main
