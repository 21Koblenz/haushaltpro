name: Plausibility and performance probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/i18n-performance-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Repair English dynamic placeholder
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('static/i18n/en.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data.setdefault('legacy',{})['z. B. Vermieter, Versicherung, Stadtwerke']='e.g. landlord, insurer, utility company'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Plausibility matrix
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          python tests/test_v0219_plausibility_matrix.py
          python tests/test_i18n_preview.py
      - name: Performance probe
        run: python scripts/performance_probe.py
      - name: Commit translation repair
        run: |
          git diff --check
          git add static/i18n/en.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete recurring transfer translation"
          git push origin HEAD:main
