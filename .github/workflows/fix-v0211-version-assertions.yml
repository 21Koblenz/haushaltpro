name: Fix v0.21.1 source version assertions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.21.1-prep
      - name: Extend legacy source version assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed=[]
          old_source = "'APP_VERSION = \"0.21.0\"' in main"
          new_source = "('APP_VERSION = \"0.21.0\"' in main or 'APP_VERSION = \"0.21.1\"' in main)"
          old_eq = "main.APP_VERSION == '0.21.0'"
          new_eq = "main.APP_VERSION in {'0.21.0','0.21.1'}"
          old_eq2 = 'main.APP_VERSION == "0.21.0"'
          new_eq2 = 'main.APP_VERSION in {"0.21.0","0.21.1"}'
          for p in sorted(Path('tests').glob('test_*.py')):
              if p.name == 'test_v211_release.py':
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              if '0.21.1' not in s or old_source in s:
                  s=s.replace(old_source,new_source)
                  s=s.replace(old_eq,new_eq)
                  s=s.replace(old_eq2,new_eq2)
              if s != old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('updated:', *changed, sep='\n- ')
          PY
      - name: Commit and push
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No source version assertion changes needed"
            exit 0
          fi
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git add tests
          git commit -m "test: support v0.21.1 in legacy source assertions"
          git push origin HEAD:release/v0.21.1-prep
