name: Apply recurring transfer and report patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recurring-transfer-report.yml
      - scripts/apply_recurring_transfer_report.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Make patch anchors resilient
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_recurring_transfer_report.py')
          s=p.read_text(encoding='utf-8')

          # The original transfer regex was deliberately conservative, but the
          # legacy block contains multiple endpoints. Replace that script fragment
          # with exact API-boundary slicing instead.
          transfer_anchor=s.index("pattern = r'@app", s.index('transfer_block ='))
          transfer_end_marker='    raise SystemExit("failed to replace transfer API block")'
          transfer_end=s.index(transfer_end_marker,transfer_anchor)+len(transfer_end_marker)
          transfer_replacement='''transfer_start = main.index('@app.get("/api/transfers/{transfer_id}")')
          transfer_end = main.index('@app.get("/api/transactions")', transfer_start)
          main = main[:transfer_start] + transfer_block + main[transfer_end:]'''
          s=s[:transfer_anchor]+transfer_replacement+s[transfer_end:]

          old='main = replace_once(main, old_report, new_report, "category report current-month forecast")'
          new='''report_fn = main.index('def category_report')
          report_start = main.index('    today=date.today()\\n    actual_end=min(end,today)\\n', report_fn)
          report_end_marker = '    """, (start.isoformat(), query_end.isoformat(), start.isoformat(), query_end.isoformat())).fetchall()\\n'
          report_end = main.index(report_end_marker, report_start) + len(report_end_marker)
          main = main[:report_start] + new_report + main[report_end:]'''
          if old not in s:
              raise SystemExit('report patch call anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply patch
        run: python scripts/apply_recurring_transfer_report.py
      - name: Validate targeted behavior
        run: |
          set -e
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          python -m compileall -q app tests
          node --check static/app.js
          python tests/test_recurring_transfers_and_current_report.py
          python tests/test_v0218_custom_recurring_intervals.py
          python tests/test_recurring_forecast_journal_invariant.py
          python tests/test_v090_transfers_payees_audit.py
          python tests/security_audit.py
          git diff --check
      - name: Commit tested patch
        run: |
          git add app/db.py app/main.py static/app.js static/index.html static/i18n/en.json CHANGELOG.md tests/test_recurring_transfers_and_current_report.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add recurring transfers and current-month forecast"
          git push origin HEAD:main
