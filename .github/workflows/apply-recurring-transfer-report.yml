name: Finalize recurring transfer migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recurring-transfer-report.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Fix migrated schema version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/db.py')
          s=p.read_text(encoding='utf-8')
          old="INSERT INTO app_meta(key,value) VALUES('schema_version','25') ON CONFLICT(key) DO UPDATE SET value='24'"
          new="INSERT INTO app_meta(key,value) VALUES('schema_version','25') ON CONFLICT(key) DO UPDATE SET value='25'"
          if old not in s:
              raise SystemExit('schema-version migration anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate migration and feature behavior
        run: |
          set -e
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          python -m compileall -q app tests
          node --check static/app.js
          python tests/test_recurring_transfers_and_current_report.py
          python tests/test_v0218_custom_recurring_intervals.py
          python tests/test_recurring_forecast_journal_invariant.py
          python tests/test_v090_transfers_payees_audit.py
          python tests/security_audit.py
          python - <<'PY'
          import sqlite3, sys, types
          shim=types.ModuleType('sqlcipher3'); shim.dbapi2=sqlite3; sys.modules['sqlcipher3']=shim
          from app import db
          c=sqlite3.connect(':memory:')
          c.row_factory=sqlite3.Row
          db.init_schema(c)
          c.execute("UPDATE app_meta SET value='24' WHERE key='schema_version'")
          db.migrate_schema(c)
          got=c.execute("SELECT value FROM app_meta WHERE key='schema_version'").fetchone()[0]
          assert got=='25',got
          print('schema migration 24 -> 25: PASS')
          PY
          git diff --check
      - name: Commit migration fix
        run: |
          git add app/db.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize recurring transfer schema migration"
          git push origin HEAD:main
