name: Apply recurring transfer and report patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recurring-transfer-report.yml
      - scripts/apply_recurring_transfer_report.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Make report patch anchor resilient
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_recurring_transfer_report.py')
          s=p.read_text(encoding='utf-8')
          old='main = replace_once(main, old_report, new_report, "category report current-month forecast")'
          new='''report_pattern = r"    today=date\\.today\\(\\)\\n    actual_end=min\\(end,today\\)\\n.*?    \\\"\\\"\\\", \\(start\\.isoformat\\(\\), query_end\\.isoformat\\(\\), start\\.isoformat\\(\\), query_end\\.isoformat\\(\\)\\)\\)\\.fetchall\\(\\)\\n"
          main, n = re.subn(report_pattern, lambda _m: new_report, main, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("failed to patch category report current-month forecast")'''
          if old not in s:
              raise SystemExit('report patch call anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply patch
        run: python scripts/apply_recurring_transfer_report.py
      - name: Validate targeted behavior
        run: |
          set -e
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          python -m compileall -q app tests
          node --check static/app.js
          python tests/test_recurring_transfers_and_current_report.py
          python tests/test_v0218_custom_recurring_intervals.py
          python tests/test_recurring_forecast_journal_invariant.py
          python tests/test_v090_transfers_payees_audit.py
          python tests/security_audit.py
          git diff --check
      - name: Commit tested patch
        run: |
          git add app/db.py app/main.py static/app.js static/index.html static/i18n/en.json CHANGELOG.md tests/test_recurring_transfers_and_current_report.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add recurring transfers and current-month forecast"
          git push origin HEAD:main
