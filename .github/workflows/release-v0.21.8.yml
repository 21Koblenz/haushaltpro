name: Release v0.21.8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.21.8.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Release v0.21.8 final retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release-v0.21.8.sh
