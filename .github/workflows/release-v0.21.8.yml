name: Release v0.21.8

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.21.8.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare v0.21.8 source metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "0.21.7"
          new = "0.21.8"
          for name in (
              "app/main.py",
              "README.md",
              "static/index.html",
              "tests/test_i18n_account_month_selfheal.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## v0.21.8 - 2026-09-14"
          if heading not in text:
              marker = "## Unreleased\n"
              entry = '''

## v0.21.8 - 2026-09-14

Bugfix and deployment-channel release. No database migration is required.

### Fixed

- Saved payees in the transaction dialog are now exposed through a real native selection control instead of relying on browser-dependent `datalist` behaviour.
- Choosing a saved payee fills the normal payee field used for saving the transaction, while free-text entry remains available for new payees.
- Added a dedicated regression guard for the saved-payee selector so the selection behaviour cannot silently regress.

### Deployment

- Every push to `main` now publishes `21koblenz/haushaltpro:dev` for `linux/amd64` and `linux/arm64`, providing a separate test channel for Portainer and other Docker deployments.
- Stable `latest` remains reserved for releases; development builds cannot overwrite the stable release tag.
- The README was cleaned up by removing obsolete preview-by-preview notes; historical implementation details remain in this changelog.

### Validation

- Full regression suite passes, including the new saved-payee selector regression.
- Static security audit passes.
- JavaScript syntax checks pass for the application and UI-enhancement bundles.
- Docker builds and SQLCipher runtime checks pass for both `linux/amd64` and `linux/arm64`.
- Published release images remain protected by Docker Scout Critical/High gates on both architectures and PyPI Medium+ gates.
'''
              if marker not in text:
                  raise SystemExit("Unreleased marker missing from CHANGELOG.md")
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Verify release metadata
        run: |
          grep -F 'APP_VERSION = "0.21.8"' app/main.py
          grep -F '# HaushaltPro v0.21.8' README.md
          grep -F '## v0.21.8 - 2026-09-14' CHANGELOG.md
          test "$(grep -o 'v=0.21.8' static/index.html | wc -l)" -ge 5
          grep -F '?v=0.21.8' tests/test_i18n_account_month_selfheal.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Regression suite
        run: |
          set -e
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          for t in tests/test_*.py; do
            echo "== $t =="
            python "$t"
          done

      - name: JavaScript syntax checks
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check static/ui-enhancements.js

      - name: Static security audit
        run: python tests/security_audit.py

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py README.md CHANGELOG.md static/index.html tests/test_i18n_account_month_selfheal.py
          git commit -m "release: v0.21.8"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            21koblenz/haushaltpro:0.21.8
            21koblenz/haushaltpro:0.21
            21koblenz/haushaltpro:latest
            21koblenz/haushaltpro:dev
          labels: |
            org.opencontainers.image.title=HaushaltPro
            org.opencontainers.image.version=0.21.8
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=https://github.com/21Koblenz/haushaltpro
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-arch manifest
        run: docker buildx imagetools inspect 21koblenz/haushaltpro:0.21.8

      - name: Docker Scout amd64 Critical/High gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:0.21.8
          platform: linux/amd64
          only-severities: critical,high
          exit-code: true
          write-comment: false

      - name: Docker Scout arm64 Critical/High gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:0.21.8
          platform: linux/arm64
          only-severities: critical,high
          exit-code: true
          write-comment: false

      - name: Docker Scout amd64 PyPI Medium+ gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:0.21.8
          platform: linux/amd64
          only-package-types: pypi
          only-severities: critical,high,medium
          exit-code: true
          write-comment: false

      - name: Docker Scout arm64 PyPI Medium+ gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:0.21.8
          platform: linux/arm64
          only-package-types: pypi
          only-severities: critical,high,medium
          exit-code: true
          write-comment: false

      - name: Create release archives and notes
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=haushaltpro-v0.21.8/ "$RELEASE_SHA" | gzip -9 > dist/haushaltpro-v0.21.8.tar.gz
          git archive --format=zip --prefix=haushaltpro-v0.21.8/ -o dist/haushaltpro-v0.21.8.zip "$RELEASE_SHA"
          (cd dist && sha256sum haushaltpro-v0.21.8.tar.gz haushaltpro-v0.21.8.zip > SHA256SUMS-v0.21.8.txt)
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = text.split("## v0.21.8 - 2026-09-14", 1)[1].split("\n## ", 1)[0].strip()
          Path("/tmp/release-notes.md").write_text(section + "\n", encoding="utf-8")
          PY

      - name: Create Git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a v0.21.8 "$RELEASE_SHA" -m "HaushaltPro v0.21.8"
          git push origin v0.21.8
          gh release create v0.21.8 \
            --target "$RELEASE_SHA" \
            --title "HaushaltPro v0.21.8" \
            --notes-file /tmp/release-notes.md \
            dist/haushaltpro-v0.21.8.tar.gz \
            dist/haushaltpro-v0.21.8.zip \
            dist/SHA256SUMS-v0.21.8.txt
