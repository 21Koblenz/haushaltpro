name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx2==2.12.0
      - name: Compile
        run: python -m compileall -q app tests
      - name: Regression suite
        run: |
          set -e
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app
          for t in tests/test_*.py; do
            echo "== $t =="
            python "$t"
          done
      - name: Static security audit
        run: python tests/security_audit.py

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (${{ matrix.platform }})
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --pull \
            --load \
            -t "haushaltpro:${{ github.sha }}" \
            .
      - name: Verify SQLCipher runtime (${{ matrix.platform }})
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint python \
            "haushaltpro:${{ github.sha }}" \
            -c "from sqlcipher3 import dbapi2 as sqlite; c=sqlite.connect(':memory:'); v=c.execute('PRAGMA cipher_version').fetchone()[0]; print('SQLCipher', v); assert str(v).startswith('4.')"
