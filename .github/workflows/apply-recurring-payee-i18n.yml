name: Apply recurring payee i18n fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recurring-payee-i18n.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add English placeholder translation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('static/i18n/en.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data.setdefault('legacy',{})['z. B. Vermieter, Versicherung, Stadtwerke']='e.g. landlord, insurer, utilities'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python tests/test_i18n_preview.py
          git diff --check
          git add static/i18n/en.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: translate recurring payee placeholder"
          git push origin HEAD:main
