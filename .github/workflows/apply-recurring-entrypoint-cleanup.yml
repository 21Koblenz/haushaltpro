name: Apply recurring entrypoint cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recurring-entrypoint-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate recurring add button
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old,new,1)

          index_path=Path('static/index.html')
          index=index_path.read_text(encoding='utf-8')
          old='<div class="section-head recurring-section-head"><div><h2>Wiederkehrende Buchungen</h2><p class="muted">Aktive Serien. Neue Serien werden hier direkt angelegt; einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.</p></div><button class="ghost" id="newRecurringTx">+ Wiederkehrende Buchung</button></div>'
          new='<div class="section-head recurring-section-head"><div><h2>Wiederkehrende Buchungen</h2><p class="muted">Aktive Serien. Neue Serien legst du über „+ Buchung“ an und aktivierst dort „Wiederkehrende Zahlung / Einnahme“. Einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.</p></div></div>'
          index=replace_once(index,old,new,'recurring section header')
          index_path.write_text(index,encoding='utf-8')

          app_path=Path('static/app.js')
          app=app_path.read_text(encoding='utf-8')
          old_js="$('quickTx').onclick=()=>txDialog();$('newTx').onclick=()=>txDialog();$('newTransfer').onclick=()=>transferDialog();$('newRecurringTx').onclick=()=>recDialog(null);"
          new_js="$('quickTx').onclick=()=>txDialog();$('newTx').onclick=()=>txDialog();$('newTransfer').onclick=()=>transferDialog();"
          app=replace_once(app,old_js,new_js,'newRecurringTx handler')
          app_path.write_text(app,encoding='utf-8')

          en_path=Path('static/i18n/en.json')
          data=json.loads(en_path.read_text(encoding='utf-8'))
          legacy=data.setdefault('legacy',{})
          old_de='Aktive Serien. Neue Serien werden hier direkt angelegt; einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.'
          legacy.pop(old_de,None)
          new_de='Aktive Serien. Neue Serien legst du über „+ Buchung“ an und aktivierst dort „Wiederkehrende Zahlung / Einnahme“. Einzelne ausgeführte Termine erscheinen zusätzlich unter „Alle Buchungen“. Änderungen können ab einem frei wählbaren Datum gelten.'
          legacy[new_de]='Active series. Create new series via “+ Transaction” and enable “Recurring payment / income” there. Individual executed occurrences also appear under “All transactions”. Changes can take effect from a freely selected date.'
          en_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          test_path=Path('tests/test_recurring_add_entrypoint.py')
          test_path.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nINDEX = (ROOT / "static" / "index.html").read_text(encoding="utf-8")\nAPP_JS = (ROOT / "static" / "app.js").read_text(encoding="utf-8")\n\nassert 'id="newTx"' in INDEX\nassert 'id="newRecurringTx"' not in INDEX\nassert "$('newTx').onclick=()=>txDialog()" in APP_JS\nassert "$('newRecurringTx').onclick" not in APP_JS\nassert 'Wiederkehrende Zahlung / Einnahme' in APP_JS\nassert 'Neue Serien legst du über „+ Buchung“ an' in INDEX\n\nprint("recurring add entrypoint regression checks: OK")\n''',encoding='utf-8')

          change_path=Path('CHANGELOG.md')
          change=change_path.read_text(encoding='utf-8')
          marker='## Unreleased\n'
          note='\n- Removed the duplicate “+ Wiederkehrende Buchung” creation button from the recurring-series tab. New recurring series are created through the normal “+ Buchung” dialog, while existing series remain manageable in the recurring tab.\n'
          if note.strip() not in change:
              change=replace_once(change,marker,marker+note,'changelog unreleased')
          change_path.write_text(change,encoding='utf-8')
          PY

          python -m compileall -q app tests
          node --check static/app.js
          python tests/test_recurring_add_entrypoint.py
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html static/app.js static/i18n/en.json tests/test_recurring_add_entrypoint.py CHANGELOG.md
          git commit -m "ui: remove duplicate recurring add button"
          git push origin HEAD:main
