name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.21.6; matching v-tag must exist)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: 21koblenz/haushaltpro
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-arch manifest
        run: docker buildx imagetools inspect 21koblenz/haushaltpro:latest

      - name: Scout amd64 Critical/High gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:latest
          platform: linux/amd64
          only-severities: critical,high
          exit-code: true
          write-comment: false

      - name: Scout arm64 Critical/High gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:latest
          platform: linux/arm64
          only-severities: critical,high
          exit-code: true
          write-comment: false

      - name: Scout amd64 PyPI Medium+ gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:latest
          platform: linux/amd64
          only-package-types: pypi
          only-severities: critical,high,medium
          exit-code: true
          write-comment: false

      - name: Scout arm64 PyPI Medium+ gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://21koblenz/haushaltpro:latest
          platform: linux/arm64
          only-package-types: pypi
          only-severities: critical,high,medium
          exit-code: true
          write-comment: false
