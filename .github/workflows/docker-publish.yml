name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.21.7; matching v-tag must exist)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Existing version tag to publish from the stable release workflow"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.target.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select published image
        id: target
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME}}"
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || exit 1
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            version="$(python -c 'import ast; t=ast.parse(open("app/main.py").read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(v,ast.Name) and v.id=="APP_VERSION" for v in n.targets)))')"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ ( -z "${REQUESTED_VERSION}" && "${GITHUB_EVENT_NAME}" == "push" && ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/dev" ) ) || "$version" == *-* ]]; then
            echo "image=21koblenz/haushaltpro:dev" >> "$GITHUB_OUTPUT"
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=21koblenz/haushaltpro:latest" >> "$GITHUB_OUTPUT"
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: 21koblenz/haushaltpro
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ steps.target.outputs.dev == 'true' }}
            type=raw,value=${{ steps.target.outputs.version }},enable=${{ !inputs.version && github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(steps.target.outputs.version, '-dev.') }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.target.outputs.dev == 'false' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && steps.target.outputs.dev == 'false' }}
            type=raw,value=latest,enable=${{ steps.target.outputs.dev == 'false' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-arch manifest
        run: docker buildx imagetools inspect "${{ steps.target.outputs.image }}"

      - name: Scout amd64 Critical/High gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ steps.target.outputs.image }}
          platform: linux/amd64
          only-severities: critical,high
          exit-code: true
          write-comment: false

      - name: Scout arm64 Critical/High gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ steps.target.outputs.image }}
          platform: linux/arm64
          only-severities: critical,high
          exit-code: true
          write-comment: false

      - name: Scout amd64 PyPI Medium+ gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ steps.target.outputs.image }}
          platform: linux/amd64
          only-package-types: pypi
          only-severities: critical,high,medium
          exit-code: true
          write-comment: false

      - name: Scout arm64 PyPI Medium+ gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ steps.target.outputs.image }}
          platform: linux/arm64
          only-package-types: pypi
          only-severities: critical,high,medium
          exit-code: true
          write-comment: false

  dev-release:
    if: github.event_name == 'push' && contains(needs.docker.outputs.version, '-dev.') && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-dev.')))
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import ast; t=ast.parse(open("app/main.py").read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(v,ast.Name) and v.id=="APP_VERSION" for v in n.targets)))')"
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "HaushaltPro $tag (dev)" \
              --notes-file "docs/RELEASE-NOTES-${tag}.md"
          fi
