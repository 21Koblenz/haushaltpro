name: Prepare v0.21.7 release tree

on:
  push:
    branches:
      - release/v0.21.7
    paths:
      - scripts/prepare_v0217.py
      - .github/workflows/prepare-v0217.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message || '', 'prepare v0.21.7 sources') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.21.7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release sources
        run: python scripts/prepare_v0217.py
      - name: Remove one-shot release preparation
        run: rm -f scripts/prepare_v0217.py .github/workflows/prepare-v0217.yml
      - name: Commit release tree
        run: |
          git config user.name "21Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare v0.21.7 sources"
          git push origin HEAD:release/v0.21.7
