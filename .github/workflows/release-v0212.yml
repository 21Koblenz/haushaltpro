name: Publish v0.21.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET: 1ab476eef79d1ba50ef1031ba2749b97c22a6857
      TAG: v0.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ab476eef79d1ba50ef1031ba2749b97c22a6857
          fetch-depth: 0
      - name: Verify release target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET"
          grep -q 'APP_VERSION = "0.21.2"' app/main.py
          test "$(git rev-parse HEAD^{tree})" = "b0ced8c18bc5ec1f6e66cf1419a81bce9f71bb70"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
      - name: Create tag and release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git tag -a "$TAG" "$TARGET" -m "HaushaltPro v0.21.2"
          git push origin "refs/tags/$TAG"
          git archive --format=tar.gz --prefix=haushaltpro-v0.21.2/ -o haushaltpro-v0.21.2.tar.gz "$TARGET"
          sha256sum haushaltpro-v0.21.2.tar.gz > haushaltpro-v0.21.2.tar.gz.sha256
          gh release create "$TAG" \
            haushaltpro-v0.21.2.tar.gz \
            haushaltpro-v0.21.2.tar.gz.sha256 \
            --verify-tag \
            --title "HaushaltPro v0.21.2" \
            --notes $'## HaushaltPro v0.21.2\n\nPatch release fixing Dashboard balances for accounts that start during the selected month.\n\n### Fixed\n- An account opening balance now becomes effective exactly on the account start date when the account begins after the first day of the month.\n- Dashboard **Aktueller Kontostand** now includes such balances after the start date instead of showing `0,00 €`.\n- **Prognose Monatsende** now includes the same opening balance correctly.\n- Negative opening balances are preserved, e.g. `-1.234,56 €`.\n- Month-opening corrections remain authoritative and are not double-counted with the original opening balance.\n\n### Validation\n- Dedicated mid-month negative opening-balance Dashboard regression: passed.\n- Full regression suite: passed.\n- Static security audit: passed.\n- Docker build + SQLCipher runtime: passed on amd64 and arm64.\n\n### Portainer upgrade\nRebuild the stack from Git tag `v0.21.2`. Keep the existing `haushaltpro_data` volume. Do not use **Pull latest image**, because HaushaltPro is built from Git and is not published as `docker.io/library/haushaltpro:latest`.\n'
