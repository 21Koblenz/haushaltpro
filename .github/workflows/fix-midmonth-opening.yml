name: Finish v0.21.2 source version assertions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/midmonth-opening-dashboard
          fetch-depth: 0
      - name: Extend remaining source version assertions line by line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          needle='\'APP_VERSION = "0.21.1"\' in main'
          replacement='(\'APP_VERSION = "0.21.1"\' in main or \'APP_VERSION = "0.21.2"\' in main)'
          changed=[]
          for p in sorted(Path('tests').glob('test_*.py')):
              lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
              out=[]
              touched=False
              for line in lines:
                  if needle in line and 'APP_VERSION = "0.21.2"' not in line:
                      line=line.replace(needle,replacement)
                      touched=True
                  out.append(line)
              if touched:
                  p.write_text(''.join(out),encoding='utf-8')
                  changed.append(str(p))
          print('updated files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
      - name: Commit and push
        shell: bash
        run: |
          if [ -z "$(git status --porcelain tests)" ]; then
            echo "No remaining source version assertions needed changes"
            exit 0
          fi
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git add tests
          git commit -m "test: finish v0.21.2 source version assertions"
          git push origin HEAD:fix/midmonth-opening-dashboard
